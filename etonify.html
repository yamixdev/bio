<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Документация Etonify: установка, подписки, серверы, маршрутизация и решение проблем."
    >
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#090a0f">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Etonify — документация">
    <meta
      property="og:description"
      content="Настройка Etonify, подписки, серверы, раздельная маршрутизация и диагностика."
    >
    <title>Etonify — документация</title>
    <link rel="icon" href="assets/etonify-logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Roboto+Mono:wght@500;700&amp;display=swap"
    >
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-25..0&amp;icon_names=add_link,alt_route,arrow_forward,backup,check,close,content_copy,dark_mode,description,devices,dns,help,install_mobile,keyboard_arrow_up,light_mode,menu,new_releases,open_in_new,power_settings_new,refresh,rocket_launch,search,shield_lock,speed,support_agent,swap_vert,system_update,troubleshoot,vpn_key,widgets&amp;display=block"
    >
    <link rel="stylesheet" href="etonify.css">
    <script>
      (() => {
        document.documentElement.classList.add('page-enter');
        window.setTimeout(() => document.documentElement.classList.remove('page-enter'), 700);
        const safeGet = (key) => {
          try {
            return localStorage.getItem(key);
          } catch (_) {
            return null;
          }
        };
        const savedLanguage = safeGet('etonify-docs-language');
        const browserLanguages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language];
        const preferredLanguage = browserLanguages
          .map((item) => item.toLowerCase())
          .find((item) => item.startsWith('ru') || item.startsWith('en'));
        const detectedLanguage = preferredLanguage?.startsWith('ru')
          ? 'ru'
          : 'en';
        const language = savedLanguage || detectedLanguage;
        document.documentElement.dataset.lang = language;
        document.documentElement.lang = language;
      })();
    </script>
    <script src="etonify-content.js" defer></script>
    <script src="etonify.js" defer></script>
    <script src="link-router.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#doc-content">К содержанию</a>
    <div class="scroll-progress" aria-hidden="true">
      <span id="scroll-progress-bar"></span>
    </div>

    <header class="site-header" aria-label="Верхняя панель">
      <div class="header-inner">
        <button
          class="icon-button menu-button"
          id="menu-button"
          type="button"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <span class="sr-only" id="menu-button-label">Открыть навигацию</span>
          <span class="material-symbols-rounded" aria-hidden="true">menu</span>
        </button>

        <a class="brand" href="#start" aria-label="Etonify">
          <img src="assets/etonify-logo.svg" width="32" height="32" alt="">
          <span class="brand-word">Etonify</span>
          <span class="brand-kind" id="brand-kind">Документация</span>
        </a>

        <div class="header-actions">
          <a class="back-to-bio" href="index.html#software" data-page-transition="back">
            <span aria-hidden="true">←</span>
            <span>Вернуться в bio</span>
          </a>

          <button
            class="search-trigger"
            id="search-trigger"
            type="button"
            aria-haspopup="dialog"
          >
            <span class="material-symbols-rounded" aria-hidden="true">search</span>
            <span id="search-trigger-label">Найти ответ</span>
            <kbd>/</kbd>
          </button>

          <div class="language-switch" role="group" aria-label="Язык">
            <button type="button" data-language="ru" aria-pressed="true">RU</button>
            <button type="button" data-language="en" aria-pressed="false">EN</button>
          </div>

        </div>
      </div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Документация">
        <div class="sidebar-scroll">
          <nav id="side-navigation" aria-label="Разделы"></nav>
          <button class="sidebar-meta" id="release-dialog-trigger" type="button" aria-haspopup="dialog">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="sidebar-meta-copy">
              <strong id="sidebar-version">Версия 0.2.5</strong>
              <span id="sidebar-platform">Android 8.0+</span>
            </span>
            <span class="material-symbols-rounded sidebar-meta-action" aria-hidden="true">arrow_forward</span>
          </button>
        </div>
      </aside>

      <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" tabindex="-1" aria-hidden="true"></button>

      <main class="main-content" id="main-content">
        <div id="doc-content" tabindex="-1"></div>
        <noscript>
          <section class="noscript-message">
            Для просмотра документации включите JavaScript. Сайт не отправляет данные и использует JavaScript только для навигации, языка и темы.
          </section>
        </noscript>
      </main>
    </div>

    <button class="to-top" id="to-top" type="button" aria-label="Наверх">
      <span class="material-symbols-rounded" aria-hidden="true">keyboard_arrow_up</span>
    </button>

    <dialog class="release-dialog" id="release-dialog" aria-labelledby="release-dialog-title">
      <div class="release-dialog-shell">
        <div class="release-dialog-head">
          <div>
            <span>Etonify · 0.2.5</span>
            <h2 id="release-dialog-title">Что изменилось</h2>
          </div>
          <button class="icon-button" id="release-dialog-close" type="button" aria-label="Закрыть">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>
        <div class="release-dialog-scroll">
          <div class="release-dialog-notes" data-release-notes aria-live="polite"></div>
        </div>
      </div>
    </dialog>

    <dialog class="search-dialog" id="search-dialog" aria-labelledby="search-title">
      <div class="search-dialog-head">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        <label class="sr-only" id="search-title" for="search-input">Поиск по документации</label>
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Что не работает?"
        >
        <button class="search-close" id="search-close" type="button" aria-label="Закрыть">Esc</button>
      </div>
      <div class="search-hint" id="search-hint">Введите хотя бы два символа</div>
      <div class="search-results" id="search-results"></div>
    </dialog>

    <div class="copy-toast" id="copy-toast" role="status" aria-live="polite"></div>
  </body>
</html>
